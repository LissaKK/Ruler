<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruler</title>
</head>
<body>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #0f172a;
      --text: #e5eefc;
      --text-soft: #94a3b8;
      --text-muted: #a7b1c5;
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.24);
      --green: #10b981;
      --green-2: #34d399;
      --blue: #60a5fa;
      --accent: #a78bfa;
      --shadow: rgba(0, 0, 0, .22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--panel-2) 0%, var(--panel) 100%);
    }

    .popup {
      width: 340px;
      padding: 16px;
      background: linear-gradient(180deg, #1e293b 0%, #111827 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 12px 30px var(--shadow);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .title::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--green);
      border: 2px solid #d1fae5;
    }

    .tool-list,
    .orientation-list {
      display: grid;
      gap: 8px;
    }

    .tool-list {
      grid-template-columns: repeat(2, minmax(130px, 1fr));
    }

    .orientation-list {
      grid-template-columns: repeat(3, minmax(80px, 1fr));
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      background: #243244;
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .01em;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }

    button:hover {
      background: #334155;
      border-color: var(--green-2);
      transform: translateY(-1px);
    }

    button.active {
      background: linear-gradient(135deg, var(--green), #047857);
      border-color: var(--green-2);
      color: white;
    }

    .ruler-section,
    .grid-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .ruler-title,
    .grid-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .grid-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      color: var(--text-soft);
      margin-bottom: 8px;
    }

    .grid-field input[type="number"] {
      width: 96px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111827;
      color: var(--text);
    }

    .checkbox-field {
      justify-content: flex-start;
    }

    .checkbox-field input {
      accent-color: var(--green);
    }

    .grid-apply {
      margin-top: 4px;
      width: 100%;
      background: linear-gradient(135deg, #334155, #1d4ed8);
    }
  </style>

  <div class="popup">
    <div class="title">Ruler</div>
    <div class="tool-list">
      <button class="tool-button" data-tool="ruler">Ruler</button>
      <button class="tool-button" data-tool="protractor">Protractor</button>
      <button class="tool-button" data-tool="eyedropper">Eyedropper</button>
      <button class="tool-button" data-tool="distance">Distance Measurement</button>
      <button class="tool-button" data-tool="grid">Grid</button>
      <button class="tool-button" data-tool="size">Size Inspector</button>
    </div>

    <div class="ruler-section">
      <div class="ruler-title">Ruler Orientation</div>
      <div class="orientation-list">
        <button class="orientation-button" data-ruler-orientation="horizontal">Horizontal</button>
        <button class="orientation-button" data-ruler-orientation="vertical">Vertical</button>
        <button class="orientation-button" data-ruler-orientation="both">Both</button>
      </div>
    </div>

    <div class="grid-section">
      <div class="grid-title">Grid Configuration</div>
      <label class="grid-field">
        <span>Grid size (px)</span>
        <input type="number" id="grid-size-input" value="8" min="2" step="1" />
      </label>
      <label class="grid-field checkbox-field">
        <input type="checkbox" id="grid-center-guides" />
        <span>Viewport center guides</span>
      </label>
      <button class="grid-apply" id="grid-apply-button">Apply Grid</button>
    </div>
  </div>
  <script type="module" src="../dist/assets/popup.js"></script>
</body>
</html>
